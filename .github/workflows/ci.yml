name: Gymnasium teaching environments
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install controlled minimal dependencies
        run: python -m pip install "gymnasium>=1.0,<1.4" "numpy>=1.24,<3"
      - name: Reset / step / seed / full episodes and Gymnasium API checker
        run: python -m unittest discover -s tests -v
